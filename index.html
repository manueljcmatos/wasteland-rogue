<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Realms of Tyra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>

<div id="hud">
  <div id="hudTop">
    <div id="bars">
      <div class="bar hp"><div id="hpFill"></div><span id="hpText"></span></div>
      <div class="bar mp"><div id="mpFill"></div><span id="mpText"></span></div>
      <div class="bar xp"><div id="xpFill"></div><span id="xpText"></span></div>
      <div class="bar rank"><div id="rankFill"></div><span id="rankText"></span></div>
      <div id="questTrk"></div>
    </div>
    <div id="side">
      <canvas id="minimap" width="120" height="120" data-act="map"></canvas>
      <div id="res">
        <div id="zoneLbl"></div>
        <div id="realmLbl"></div>
        <div><span>🪙</span><b id="goldTxt">0</b></div>
        <div><span>⚙️</span><b id="scrapTxt">0</b></div>
        <div id="resRow"></div>
        <div id="shardRow" style="display:none"><span>☢️</span><b id="shardTxt">0</b></div>
      </div>
    </div>
  </div>
  <div id="topBtns">
    <button data-act="menu" aria-label="Menu">☰</button>
    <button data-act="bag" aria-label="Bag">🎒</button>
    <button data-act="skills" aria-label="Skills">⭐<i id="spBadge"></i></button>
    <button id="btnChat" data-act="chat" aria-label="Chat" style="display:none">💬</button>
  </div>
  <div id="chatLog"></div>
  <div id="actBtns">
    <button id="btnHome" data-act="home"><span id="homeLbl">🏠 Base</span></button>
    <button id="btnRecall" data-act="recall"><span id="recallLbl">🏠</span></button>
    <button id="btnAbility" data-act="ability"><span id="abIcon">✨</span><em id="abCost"></em><div id="abCd"></div></button>
    <div class="potrow">
      <button id="btnHp" data-act="hp" class="pot">❤️<i id="hpCount"></i></button>
      <button id="btnMp" data-act="mp" class="pot">🔷<i id="mpCount"></i></button>
    </div>
    <button id="btnDash" data-act="dash">💨</button>
  </div>
  <div id="toasts"></div>
  <div id="banner"></div>
</div>

<div id="modal" class="hidden"><div id="panel"></div></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/net.js"></script>
<script src="js/ton.js"></script>
<script src="js/mp.js"></script>
<script src="js/realm.js"></script>
<script src="js/explore.js"></script>
<script src="js/ui.js"></script>
<script src="js/art.js"></script>
<script src="js/icons.js"></script>
<script src="js/game.js"></script>
</body>
</html>
